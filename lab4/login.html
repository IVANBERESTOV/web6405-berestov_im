<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>File Server - Авторизация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

<header class="header">
    <h1 class="header__title">
        <img src="images/logo.svg" alt="Логотип" class="header__logo">File Server
    </h1>
</header>

<nav class="nav">
    <a href="upload.html" class="nav__link">Загрузить файл</a>
    <a href="files.html" class="nav__link">Мои файлы</a>
    <a href="about.html" class="nav__link">О проекте</a>
    <a href="login.html" class="nav__link nav__link_active">Вход</a>
</nav>

<main class="content">

    <section class="card">
        <h2 class="card__title">Авторизация</h2>

        <form class="form" id="loginForm" action="#" method="post">
            <label class="form__label">
                Логин:
                <input class="form__input" type="text" name="login" required>
            </label>

            <label class="form__label">
                Пароль:
                <input class="form__input" type="password" name="password" required>
            </label>

            <label class="form__label form__label_checkbox">
                <input class="form__checkbox" type="checkbox" name="agreement" required>
                Согласие на обработку персональных данных
            </label>

            <button type="submit" class="form__btn">Войти</button>
        </form>
    </section>

</main>

<script src="js/auth.js"></script>
</body>
</html>
